name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache ESP32 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ hashFiles('tools/fqbn.sh') }}

      - name: Install core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library"

      - name: Check the tag matches the firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/.*FIRMWARE_VERSION *"\([^"]*\)".*/\1/p' fleabyte/config.h)"
          if [ "$tag" != "$ver" ]; then
            echo "Tag $GITHUB_REF_NAME does not match FIRMWARE_VERSION $ver" >&2
            exit 1
          fi
          echo "tag and firmware agree on $ver"

      - name: Build release image
        run: ./tools/release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            release/firmware.bin
            release/firmware.bin.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/firmware.bin
            release/firmware.bin.sha256
